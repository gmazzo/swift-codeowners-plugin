name: CI/CD
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  checks: write
  pull-requests: write

jobs:
  build:
    name: Build (${{ matrix.name }}, Swift ${{ matrix.swift-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        name: [ 'Plugin', 'Demo' ]
        swift-version: [ '6.0', 'latest' ]
        os: [ 'ubuntu', 'macos' ]
        include:
          - name: Plugin
            projectDir: ""
            moduleTarget: "swift-codeowners-plugin"
          - name: Demo
            projectDir: "Demo"
            moduleTarget: "Demo Project"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup host
        uses: ./.github/actions/setup-host
        with:
          swift-version: ${{ matrix.swift-version }}
          cache-suffix: ${{ matrix.name }}
      - name: Test & Build
        working-directory: ${{ matrix.projectDir }}
        shell: bash
        run: swift test --xunit-output .build/test-results.xml --enable-code-coverage
      - name: Publish Test Report
        if: ${{ !cancelled() }}
        uses: gmazzo/publish-report-annotations@v1
        with:
          checkName: Test Results (${{ matrix.name }}, Swift ${{ matrix.swift-version }}, ${{ matrix.os }})
          reports: '**/.build/test-results*.xml'
      - name: Extract coverage data
        if: ${{ runner.os == 'linux' }}
        working-directory: ${{ matrix.projectDir }}
        shell: bash
        run: |
          COVERAGE_FILE=$(swift test --show-codecov-path)
          BUILD_DIR="${COVERAGE_FILE%/*/*}"
          
          llvm-cov export -format="lcov" \
            "$BUILD_DIR/${{ matrix.moduleTarget }}PackageTests.xctest" \
            -instr-profile "$BUILD_DIR/codecov/default.profdata" > .build/lcov.info
      - name: Coverage report
        if: ${{ runner.os == 'linux' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  build-tuist:
    name: Build (Tuist Demo)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Tuist
        working-directory: TuistDemo
        shell: bash
        run: |
          brew install tuist
          tuist auth login
          tuist setup cache
      - name: Test & Build
        working-directory: TuistDemo
        shell: bash
        run:
          tuist test --no-selective-testing --result-bundle-path .build/tests.xcresult
      - name: Publish Test Report
        if: ${{ !cancelled() }}
        uses: gmazzo/publish-report-annotations@v1
        with:
          checkName: Test Results (Tuist Demo)
          reports: 'TuistDemo/.build/tests.xcresult'

  build-passed:
    name: Build passed
    runs-on: ubuntu-latest
    needs:
      - build
      - build-tuist
    if: ${{ !cancelled() }}
    steps:
      - name: Check `Build` has passed
        if: ${{ contains(needs.*.result, 'failure') }}
        run: |
          echo "Build was not successful!" 
          exit 1

  actionlint:
    name: Validate Workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download actionlint
        shell: bash
        run: bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
      - name: Check workflow files
        shell: bash
        run: ./actionlint -color -format '{{range $err := .}}::error file={{$err.Filepath}},line={{$err.Line}},col={{$err.Column}}::{{$err.Message}}%0A```%0A{{replace $err.Snippet "\\n" "%0A"}}%0A```\n{{end}}' -ignore 'SC2016:'
