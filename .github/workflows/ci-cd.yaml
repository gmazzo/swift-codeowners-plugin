name: Build
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  checks: write
  pull-requests: write

jobs:
  ci-cd:
    name: CI/CD (${{ matrix.name }}, Swift ${{ matrix.swift-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os == 'ios' && 'macos' || matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        name: [ 'Plugin', 'Demo' ]
        swift-version: [ '6.0', 'latest' ]
        os: [ 'ubuntu', 'macos', 'ios' ]
        include:
          - name: Plugin
            projectDir: ""
            moduleTarget: "swift-codeowners-plugin"
          - name: Demo
            projectDir: "Demo"
            moduleTarget: "Demo Project"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup host
        uses: ./.github/actions/setup-host
        with:
          swift-version: ${{ matrix.swift-version }}
      - name: Test & Build
        working-directory: ${{ matrix.projectDir }}
        env:
          SWIFT_ARGS: ${{ matrix.os == 'ios' && format('-Xswiftc "-sdk" -Xswiftc "`xcrun --sdk iphonesimulator --show-sdk-path`" -Xswiftc "-target" -Xswiftc "{0}-apple-ios{1}-simulator"', runner.arch, '16.0') || '' }}
        run: swift test --xunit-output .build/test-results.xml --enable-code-coverage ${{ env.SWIFT_ARGS }}
      - name: Publish Test Report
        if: ${{ !cancelled() }}
        uses: gmazzo/publish-report-annotations@v1
        with:
          checkName: Test Results (${{ matrix.name }})
          reports: '**/.build/test-results*.xml'
      - name: Extract coverage data
        if: ${{ runner.os == 'linux' }}
        working-directory: ${{ matrix.projectDir }}
        run: |
          COVERAGE_FILE=$(swift test --show-codecov-path)
          BUILD_DIR="${COVERAGE_FILE%/*/*}"
          
          llvm-cov export -format="lcov" \
            "$BUILD_DIR/${{ matrix.moduleTarget }}PackageTests.xctest" \
            -instr-profile "$BUILD_DIR/codecov/default.profdata" > .build/lcov.info
      - name: Coverage report
        if: ${{ runner.os == 'linux' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  ci-cd-passed:
    name: CI/CD passed
    runs-on: ubuntu-latest
    needs: ci-cd
    if: ${{ !cancelled() }}
    steps:
      - name: Check CI-CD has passed
        if: ${{ needs.ci-cd.result != 'success' }}
        run: |
          echo "CI/CD was not successful!" 
          exit 1

  actionlint:
    name: Validate Workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Download actionlint
        shell: bash
        run: bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
      - name: Check workflow files
        shell: bash
        run: ./actionlint -color -format '{{range $err := .}}::error file={{$err.Filepath}},line={{$err.Line}},col={{$err.Column}}::{{$err.Message}}%0A```%0A{{replace $err.Snippet "\\n" "%0A"}}%0A```\n{{end}}' -ignore 'SC2016:'
