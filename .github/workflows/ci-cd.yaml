name: CI/CD
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  checks: write
  pull-requests: write

jobs:
  build-spm:
    name: Build (${{ matrix.name }}, Swift ${{ matrix.swift-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        swift-version: [ '6.0', 'latest' ]
        os: [ 'ubuntu', 'macos' ]
        include:
          - name: Plugin
            projectDir: ""
            moduleTarget: "swift-codeowners-plugin"
          - name: SPM Codegen Demo
            projectDir: "Demos/spm/codegen"
            moduleTarget: "SPM Codegen Demo"
          - name: SPM Codegen+Macro Demo
            projectDir: "Demos/spm/codegen_and_macro"
            moduleTarget: "SPM Codegen+Macro Demo"
          - name: SPM Macro Demo
            projectDir: "Demos/spm/macro"
            moduleTarget: "SPM Macro Demo"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Swift
        uses: SwiftyLab/setup-swift@v1
        with:
          swift-version: ${{ matrix.swift-version }}
      - name: SPM Cache
        uses: actions/cache@v5
        with:
          path: '**/.build/'
          key: ${{ runner.os }}-swift-${{ matrix.swift-version }}-${{ matrix.name }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swift-${{ matrix.swift-version }}-${{ matrix.name }}-spm-
      - name: Test & Build
        working-directory: ${{ matrix.projectDir }}
        shell: bash
        run: swift test --xunit-output .build/test-results.xml --enable-code-coverage
      - name: Publish Test Report
        if: ${{ !cancelled() }}
        uses: gmazzo/publish-report-annotations@v1
        with:
          checkName: Test Results (${{ matrix.name }}, Swift ${{ matrix.swift-version }}, ${{ matrix.os }})
          reports: '**/.build/test-results*.xml'
      - name: Extract coverage data
        if: ${{ runner.os == 'linux' }}
        working-directory: ${{ matrix.projectDir }}
        shell: bash
        run: |
          COVERAGE_FILE=$(swift test --show-codecov-path)
          BUILD_DIR="${COVERAGE_FILE%/*/*}"
          
          llvm-cov export -format="lcov" \
            "$BUILD_DIR/${{ matrix.moduleTarget }}PackageTests.xctest" \
            -instr-profile "$BUILD_DIR/codecov/default.profdata" > .build/lcov.info
      - name: Coverage report
        if: ${{ runner.os == 'linux' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  build-tuist:
    name: Build (${{ matrix.name }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Tuist Codegen Demo
            projectDir: "Demos/tuist/codegen"
            moduleTarget: "Tuist Codegen Demo"
          - name: Tuist Codegen+Macro Demo
            projectDir: "Demos/tuist/codegen_and_macro"
            moduleTarget: "Tuist Codegen+Macro Demo"
          - name: Tuist Macro Demo
            projectDir: "Demos/tuist/macro"
            moduleTarget: "Tuist Macro Demo"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Mise
        uses: jdx/mise-action@v4
      - name: Setup Tuist
        shell: bash
        run: |
          tuist auth login
          tuist setup cache
      - name: Test & Build
        working-directory: ${{ matrix.projectDir }}
        shell: bash
        run:
          tuist test --no-selective-testing --result-bundle-path .build/tests.xcresult
      - name: Publish Test Report
        if: ${{ !cancelled() }}
        uses: gmazzo/publish-report-annotations@v1
        with:
          checkName: Test Results (${{ matrix.name }})
          reports: '${{ matrix.projectDir }}/.build/tests.xcresult'

  build-passed:
    name: Build passed
    runs-on: ubuntu-latest
    needs:
      - build-spm
      - build-tuist
    if: ${{ !cancelled() }}
    steps:
      - name: Check `Build` has passed
        if: ${{ contains(needs.*.result, 'failure') }}
        run: |
          echo "Build was not successful!" 
          exit 1

  actionlint:
    name: Validate Workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download actionlint
        shell: bash
        run: bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
      - name: Check workflow files
        shell: bash
        run: ./actionlint -color -format '{{range $err := .}}::error file={{$err.Filepath}},line={{$err.Line}},col={{$err.Column}}::{{$err.Message}}%0A```%0A{{replace $err.Snippet "\\n" "%0A"}}%0A```\n{{end}}' -ignore 'SC2016:'
