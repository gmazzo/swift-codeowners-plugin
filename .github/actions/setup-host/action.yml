name: 'Setup Host'
description: 'Configures the host runner to run the build'

inputs:
  swift-version:
    description: 'The Swift version to install'
    required: true
  cache-suffix:
    description: 'Suffix to append to cache keys'
    required: true

runs:
  using: "composite"
  steps:
    - name: Setup Swift
      uses: SwiftyLab/setup-swift@v1
      with:
        swift-version: ${{ inputs.swift-version }}
    - name: Swift Twist
      if: ${{ runner.os == 'macos' }}
      shell: bash
      run: |
        brew install tuist
        tuist auth login
        tuist install --force-resolved-versions --replace-scm-with-registry
        tuist setup cache
    - name: Swift Package Manager Cache
      if: ${{ runner.os != 'macos' }}
      uses: actions/cache@v5
      with:
        path: '**/.build/'
        key: ${{ runner.os }}-swift-${{ inputs.swift-version }}-${{ inputs.cache-suffix }}-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-swift-${{ inputs.swift-version }}-${{ inputs.cache-suffix }}-spm-
